<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo animation review</title>
<style>body{margin:24px;background:#0b1728;color:#e7eee9;font:16px system-ui}canvas{width:min(100%,1280px);height:auto;image-rendering:pixelated;background:#122d38;border:1px solid #51717b}button,select,label{font:inherit;margin:6px;padding:8px}p{max-width:75ch}</style>
<h1>Tempo motion review</h1><p>Actual production renderer. Check boots, limb silhouettes, muzzle alignment, mirrored turns and stopped ladder grips. This review page is development material.</p>
<select id="mode"><option>automatic</option><option>idle</option><option>run</option><option>runFire</option><option>air</option><option>climb</option><option>climbFire</option><option>climbHold</option><option>descend</option><option>victory</option></select>
<button id="pause">Pause</button><button id="flip">Turn</button><label><input id="bounds" type="checkbox" checked>Collider and muzzle</label><div id="status"></div>
<canvas id="view" width="640" height="300"></canvas>
<script type="module">
import {drawTempo,preloadTempoArt,tempoFrame} from '../../public/hero-art.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const p={x:60,y:79,w:14,h:29,vx:0,vy:0,onGround:true,facing:1,runDistance:0,climbDistance:0,shotCooldown:0,invulnerable:0};
let paused=false,t=0,last=performance.now();document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#flip').onclick=()=>p.facing*=-1;
await preloadTempoArt();
function frame(now){const dt=paused?0:Math.min(.04,(now-last)/1000);last=now;t+=dt;let mode=document.querySelector('#mode').value;
if(mode==='automatic')mode=['idle','run','runFire','air','climb','climbHold','descend','climbFire'][Math.floor(t/3)%8];
p.onGround=!['air','climb','climbHold','descend','climbFire'].includes(mode);p.ladder=mode.includes('climb')||mode==='descend'?{}:null;
p.vx=mode.startsWith('run')?105:0;p.shotCooldown=mode.endsWith('Fire')?.28:0;p.vy=mode==='air'?Math.sin(t*3)*220:mode==='climbHold'?0:mode==='descend'?76:-76;
if(p.vx)p.runDistance+=105*dt;if(p.ladder&&mode!=='climbHold')p.climbDistance+=(mode==='descend'?-1:1)*76*dt;
ctx.clearRect(0,0,640,300);ctx.fillStyle='#122d38';ctx.fillRect(0,0,640,300);
function panel(scale,ox,oy){ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#55706c';ctx.fillRect(0,108,155,2);
if(p.ladder){ctx.fillStyle='#577d81';ctx.fillRect(58,40,2,70);ctx.fillRect(76,40,2,70);for(let y=45;y<110;y+=9)ctx.fillRect(58,y,20,1);}
drawTempo(ctx,p,t,{mode:mode==='victory'?'victory':'play'});
if(document.querySelector('#bounds').checked){ctx.strokeStyle='#f0bc64';ctx.lineWidth=.5;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#eb6388';ctx.fillRect(p.x+(p.facing>0?16:-2)-1,p.y+18-1,3,3);}ctx.restore();}
panel(1,15,140);panel(3,150,-30);status.textContent=mode+' · '+tempoFrame(p,t).group+' · frame '+tempoFrame(p,t).frame;
requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
